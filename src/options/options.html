<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Globemallow - Internet Sustainability</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <script src="chart.js" type="text/javascript"></script>
        <script src="options.bundle.js" defer></script>
        <link rel="stylesheet" href="options.css" />
    </head>

    <body>
        <div class="panel-container">
            <!-- Header (panel-like) -->
            <header class="panel-header">
                <div class="header-row">
                    <a
                        class="leftNav"
                        id="iconGB"
                        href="#something"
                        style="display: grid; place-items: center"
                    >
                        <img
                            src="assets/logo.png"
                            style="border-radius: 100%"
                            loading="lazy"
                            alt="Globemallow logo"
                        />
                    </a>

                    <div class="header-text">
                        <h1 id="gbTitle">Globemallow</h1>
                        <p class="subtitle">
                            Sustainability Development Reports
                        </p>
                    </div>

                    <!-- Nav moved into header -->
                    <nav id="menuBar" class="header-nav">
                        <a id="siteOver" class="header-tab" href="#Home"
                            >Site Comparison</a
                        >
                    </nav>
                </div>
            </header>

            <!-- Main content -->
            <main class="content">
                <section class="card" id="chartDiv">
                    <div class="card-header">
                        <h2 class="card-title" id="chartTitle">
                            Site Comparison
                        </h2>
                    </div>
                    <div class="card-body">
                        <canvas id="myChart"></canvas>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
